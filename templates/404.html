{{> head}}
{{> header}}

<main>
<section class="hero hero--city hero--slim notfound">
  <svg class="deco deco--star1" aria-hidden="true"><use href="#i-star"/></svg>
  <span class="deco deco--bubble1" aria-hidden="true"></span>
  <span class="deco deco--bubble3" aria-hidden="true"></span>
  <div class="container">
    <div class="hero__text hero__text--center">
      <p class="notfound__code" aria-hidden="true">404</p>
      <h1><span class="tagline">Ups, ovaj mehurić je pukao!</span> Stranica nije pronađena</h1>
      <p class="lead">Stranica koju tražite ne postoji ili je premeštena. Ali zabava je i dalje tu – izaberite gde želite dalje:</p>
      <div class="hero__cta">
        <a href="/" class="btn btn--lilac">Početna strana</a>
        <a href="/#paketi" class="btn btn--outline">Paketi i cene</a>
        <a href="/#rezervacija" class="btn btn--outline">Rezervacija</a>
      </div>
      <p class="city-links">{{otherCityLinks}}</p>
    </div>
  </div>
</section>
</main>

{{> footer}}
